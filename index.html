<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSClub Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // Lucide SVG Icons
      function SettingsIcon({ size = 20, className = "" }) {
        return (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        );
      }

      function CheckIcon({ size = 18, className = "" }) {
        return (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        );
      }

      function XIcon({ size = 20, className = "" }) {
        return (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        );
      }

      function UploadIcon({ size = 20, className = "" }) {
        return (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        );
      }

      function ClockIcon({ size = 20, className = "" }) {
        return (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        );
      }

      function ImageIcon({ size = 20, className = "" }) {
        return (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
            <circle cx="9" cy="9" r="2"/>
            <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
          </svg>
        );
      }

      function PlayIcon({ size = 20, className = "" }) {
        return (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
        );
      }

      function PauseIcon({ size = 20, className = "" }) {
        return (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <rect x="6" y="4" width="4" height="16"/>
            <rect x="14" y="4" width="4" height="16"/>
          </svg>
        );
      }

      function RefreshCwIcon({ size = 20, className = "" }) {
        return (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M8 16H3v5"/>
          </svg>
        );
      }

      // TimeUnit Component
      function TimeUnit({ value, label }) {
        const maxValue = label === 'HOURS' ? 24 : 60;
        const numericValue = parseInt(value);
        const progressPercentage = (numericValue / maxValue) * 100;
        const circumference = 283;
        const strokeDashoffset = circumference - (circumference * progressPercentage) / 100;

        return (
          <div className="flex flex-col items-center">
            <div className="relative w-32 h-32 md:w-40 md:h-40 lg:w-48 lg:h-48">
              <div className="absolute inset-0 bg-gray-800 border-2 border-gray-700 rounded-full shadow-xl"></div>
              <svg className="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="none" stroke="#1a1a1a" strokeWidth="6" />
                <circle
                  cx="50"
                  cy="50"
                  r="45"
                  fill="none"
                  stroke="url(#gradient)"
                  strokeWidth="6"
                  strokeDasharray={circumference}
                  strokeDashoffset={strokeDashoffset}
                  strokeLinecap="round"
                  style={{ transition: 'stroke-dashoffset 1s linear' }}
                />
                <defs>
                  <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stopColor="#4285F4" />
                    <stop offset="33%" stopColor="#34A853" />
                    <stop offset="66%" stopColor="#FBBC05" />
                    <stop offset="100%" stopColor="#EA4335" />
                  </linearGradient>
                </defs>
              </svg>
              <div className="absolute inset-0 flex items-center justify-center">
                <span className="text-4xl font-bold text-white md:text-5xl lg:text-6xl">
                  {value}
                </span>
              </div>
            </div>
            <span className="mt-3 text-base font-semibold tracking-wide text-gray-300 md:text-lg">
              {label}
            </span>
          </div>
        );
      }

      // Timer Component
      function Timer({ timeRemaining }) {
        const hours = Math.floor(timeRemaining / 3600);
        const minutes = Math.floor((timeRemaining % 3600) / 60);
        const seconds = timeRemaining % 60;

        const formatTime = (time) => time.toString().padStart(2, '0');

        return (
          <div className="flex flex-col items-center justify-center gap-4 mb-8 md:flex-row md:gap-8">
            <TimeUnit value={formatTime(hours)} label="HOURS" />
            <TimeUnit value={formatTime(minutes)} label="MINUTES" />
            <TimeUnit value={formatTime(seconds)} label="SECONDS" />
          </div>
        );
      }

      // Button Component
      function Button({ children, onClick, color }) {
        const colorClasses = {
          green: 'bg-[#34A853] hover:bg-[#2E9549] border-[#2E9549]',
          yellow: 'bg-[#FBBC05] hover:bg-[#E0A800] border-[#E0A800]',
          red: 'bg-[#EA4335] hover:bg-[#D03A2E] border-[#D03A2E]',
          blue: 'bg-[#4285F4] hover:bg-[#3B78DC] border-[#3B78DC]',
        };

        return (
          <button
            onClick={onClick}
            className={`flex items-center justify-center px-6 py-3 rounded-full text-white font-medium transition-all shadow-lg border ${colorClasses[color]} min-w-[120px]`}
          >
            {children}
          </button>
        );
      }

      // TimerControls Component
      function TimerControls({ isActive, isPaused, onStart, onPause, onResume, onRestart }) {
        return (
          <div className="flex justify-center items-center gap-4">
            {!isActive ? (
              <Button onClick={onStart} color="green">
                <PlayIcon size={20} className="mr-2" />
                Start
              </Button>
            ) : isPaused ? (
              <Button onClick={onResume} color="green">
                <PlayIcon size={20} className="mr-2" />
                Resume
              </Button>
            ) : (
              <Button onClick={onPause} color="yellow">
                <PauseIcon size={20} className="mr-2" />
                Pause
              </Button>
            )}
            <Button onClick={onRestart} color="red">
              <RefreshCwIcon size={20} className="mr-2" />
              Restart
            </Button>
          </div>
        );
      }

      // TimerSettings Component
      function TimerSettings({ onSetTime, currentTime, isActive, onBackgroundChange, currentBackground }) {
        const [isOpen, setIsOpen] = useState(false);
        const [hours, setHours] = useState(Math.floor(currentTime / 3600));
        const [minutes, setMinutes] = useState(Math.floor((currentTime % 3600) / 60));
        const [seconds, setSeconds] = useState(currentTime % 60);
        const [previewImage, setPreviewImage] = useState(null);

        useEffect(() => {
          setHours(Math.floor(currentTime / 3600));
          setMinutes(Math.floor((currentTime % 3600) / 60));
          setSeconds(currentTime % 60);
        }, [currentTime]);

        const handleApply = () => {
          const totalSeconds = hours * 3600 + minutes * 60 + seconds;
          if (totalSeconds > 0) {
            onSetTime(totalSeconds);
            setIsOpen(false);
          }
        };

        const handleCancel = () => {
          setHours(Math.floor(currentTime / 3600));
          setMinutes(Math.floor((currentTime % 3600) / 60));
          setSeconds(currentTime % 60);
          setPreviewImage(null);
          setIsOpen(false);
        };

        const toggleSidebar = () => setIsOpen(!isOpen);

        const handleInputChange = (setter, value, max) => {
          const numValue = parseInt(value) || 0;
          setter(Math.min(Math.max(0, numValue), max));
        };

        const handleImageUpload = (event) => {
          const file = event.target.files[0];
          if (file?.type.startsWith("image/")) {
            const reader = new FileReader();
            reader.onload = (e) => {
              const imageUrl = e.target.result;
              setPreviewImage(imageUrl);
              onBackgroundChange(imageUrl);
            };
            reader.readAsDataURL(file);
          }
        };

        const handleRemoveBackground = () => {
          setPreviewImage(null);
          onBackgroundChange(null);
        };

        return (
          <>
            <button
              onClick={toggleSidebar}
              disabled={isActive}
              className={`fixed top-6 right-6 z-50 flex items-center gap-2 px-4 py-3 rounded-full shadow-lg transition-all transform hover:scale-105 ${
                isActive
                  ? "bg-gray-600 cursor-not-allowed opacity-50"
                  : "bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white"
              }`}
            >
              <SettingsIcon size={20} />
              <span className="hidden sm:inline">Settings</span>
            </button>

            <div
              className={`fixed inset-0 bg-black/50 backdrop-blur-sm z-40 transition-opacity duration-300 ${
                isOpen ? "opacity-100" : "opacity-0 pointer-events-none"
              }`}
              onClick={handleCancel}
              role="button"
              tabIndex={0}
              aria-label="Close settings sidebar"
            />

            <div
              className={`fixed top-0 right-0 h-full w-96 bg-gradient-to-b from-gray-900 to-black shadow-2xl z-50 transform transition-transform duration-300 ease-in-out ${
                isOpen ? "translate-x-0" : "translate-x-full"
              }`}
            >
              <div className="flex items-center justify-between p-6 border-b border-white/20">
                <h2 className="text-xl font-bold text-white">Timer Settings</h2>
                <button
                  onClick={handleCancel}
                  className="p-2 rounded-full hover:bg-white/10 transition-colors"
                >
                  <XIcon size={20} className="text-white" />
                </button>
              </div>

              <div className="p-6 space-y-8 overflow-y-auto h-full pb-24">
                <div className="space-y-4">
                  <div className="flex items-center gap-3 mb-4">
                    <ClockIcon size={20} className="text-blue-400" />
                    <h3 className="text-lg font-semibold text-white">Timer Duration</h3>
                  </div>

                  <div className="bg-white/5 rounded-xl p-6 border border-white/10">
                    <div className="grid grid-cols-3 gap-4">
                      <div className="space-y-2">
                        <label htmlFor="hours-input" className="block text-sm font-medium text-white/80">Hours</label>
                        <input
                          id="hours-input"
                          type="number"
                          min="0"
                          max="23"
                          value={hours}
                          onChange={(e) => handleInputChange(setHours, e.target.value, 23)}
                          className="w-full px-3 py-2 bg-white/10 border border-white/20 rounded-lg text-white text-center focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        />
                      </div>

                      <div className="space-y-2">
                        <label htmlFor="minutes-input" className="block text-sm font-medium text-white/80">Minutes</label>
                        <input
                          id="minutes-input"
                          type="number"
                          min="0"
                          max="59"
                          value={minutes}
                          onChange={(e) => handleInputChange(setMinutes, e.target.value, 59)}
                          className="w-full px-3 py-2 bg-white/10 border border-white/20 rounded-lg text-white text-center focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        />
                      </div>

                      <div className="space-y-2">
                        <label htmlFor="seconds-input" className="block text-sm font-medium text-white/80">Seconds</label>
                        <input
                          id="seconds-input"
                          type="number"
                          min="0"
                          max="59"
                          value={seconds}
                          onChange={(e) => handleInputChange(setSeconds, e.target.value, 59)}
                          className="w-full px-3 py-2 bg-white/10 border border-white/20 rounded-lg text-white text-center focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        />
                      </div>
                    </div>

                    <div className="mt-4 p-3 bg-blue-500/20 rounded-lg">
                      <p className="text-sm text-blue-200 text-center">
                        Total: {String(hours).padStart(2, "0")}:
                        {String(minutes).padStart(2, "0")}:
                        {String(seconds).padStart(2, "0")}
                      </p>
                    </div>
                  </div>
                </div>

                <div className="space-y-4">
                  <div className="flex items-center gap-3 mb-4">
                    <ImageIcon size={20} className="text-purple-400" />
                    <h3 className="text-lg font-semibold text-white">Background Image</h3>
                  </div>

                  <div className="bg-white/5 rounded-xl p-6 border border-white/10 space-y-4">
                    {(previewImage || currentBackground) && (
                      <div className="space-y-3">
                        <p className="text-sm text-white/70">Current Background:</p>
                        <div className="relative w-full h-32 rounded-lg overflow-hidden border border-white/20">
                          <img
                            src={previewImage || currentBackground}
                            alt="Background preview"
                            className="w-full h-full object-cover"
                          />
                          <button
                            onClick={handleRemoveBackground}
                            className="absolute top-2 right-2 p-1.5 bg-red-500 hover:bg-red-600 rounded-full transition-colors"
                          >
                            <XIcon size={14} className="text-white" />
                          </button>
                        </div>
                      </div>
                    )}

                    <div>
                      <input
                        type="file"
                        accept="image/*"
                        onChange={handleImageUpload}
                        className="hidden"
                        id="background-upload"
                      />
                      <label
                        htmlFor="background-upload"
                        className="flex items-center justify-center gap-3 w-full p-4 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white rounded-lg transition-all cursor-pointer border-2 border-dashed border-purple-300/50 hover:border-purple-300"
                      >
                        <UploadIcon size={20} />
                        <span>Upload New Background</span>
                      </label>
                      <p className="text-xs text-white/50 mt-2 text-center">
                        Supports JPG, PNG, GIF files
                      </p>
                    </div>
                  </div>
                </div>
              </div>

              <div className="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-black to-transparent">
                <div className="flex gap-3">
                  <button
                    onClick={handleApply}
                    className="flex-1 flex items-center justify-center gap-2 px-4 py-3 bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white rounded-lg transition-all font-medium"
                  >
                    <CheckIcon size={18} />
                    Apply Changes
                  </button>
                  <button
                    onClick={handleCancel}
                    className="flex items-center justify-center gap-2 px-4 py-3 bg-white/10 hover:bg-white/20 text-white rounded-lg transition-all"
                  >
                    <XIcon size={18} />
                  </button>
                </div>
              </div>
            </div>
          </>
        );
      }

      // App Component
      function App() {
        const FIVE_HOURS_IN_SECONDS = 5 * 60 * 60;
        const [initialDuration, setInitialDuration] = useState(FIVE_HOURS_IN_SECONDS);
        const [timeRemaining, setTimeRemaining] = useState(FIVE_HOURS_IN_SECONDS);
        const [isActive, setIsActive] = useState(false);
        const [isPaused, setIsPaused] = useState(false);
        const [showControls, setShowControls] = useState(true);
        const [backgroundImage, setBackgroundImage] = useState("/background.png");
        const inactivityTimer = useRef(null);

        useEffect(() => {
          let interval;
          if (isActive && !isPaused) {
            interval = window.setInterval(() => {
              setTimeRemaining((time) => {
                if (time <= 0) {
                  clearInterval(interval);
                  setIsActive(false);
                  return 0;
                }
                return time - 1;
              });
            }, 1000);
          } else {
            clearInterval(interval);
          }
          return () => clearInterval(interval);
        }, [isActive, isPaused]);

        useEffect(() => {
          const resetInactivityTimer = () => {
            setShowControls(true);
            if (inactivityTimer.current) {
              clearTimeout(inactivityTimer.current);
            }
            inactivityTimer.current = setTimeout(() => {
              setShowControls(false);
            }, 2000);
          };

          const handleMouseMove = () => resetInactivityTimer();
          const handleMouseEnter = () => resetInactivityTimer();

          document.addEventListener("mousemove", handleMouseMove);
          document.addEventListener("mouseenter", handleMouseEnter);
          resetInactivityTimer();

          return () => {
            document.removeEventListener("mousemove", handleMouseMove);
            document.removeEventListener("mouseenter", handleMouseEnter);
            if (inactivityTimer.current) {
              clearTimeout(inactivityTimer.current);
            }
          };
        }, []);

        const handleStart = () => {
          setIsActive(true);
          setIsPaused(false);
        };

        const handlePause = () => setIsPaused(true);
        const handleResume = () => setIsPaused(false);
        const handleRestart = () => {
          setTimeRemaining(initialDuration);
          setIsActive(false);
          setIsPaused(false);
        };

        const handleSetTime = (newDuration) => {
          setInitialDuration(newDuration);
          setTimeRemaining(newDuration);
          setIsActive(false);
          setIsPaused(false);
        };

        const handleBackgroundChange = (newBackground) => {
          if (newBackground) {
            setBackgroundImage(newBackground);
          } else {
            setBackgroundImage("/background.png");
          }
        };

        return (
          <div
            className="flex flex-col items-center justify-center w-full min-h-screen bg-center bg-cover relative"
            style={{
              backgroundImage: `url(${backgroundImage})`,
              backgroundColor: "#1a1a1a",
            }}
          >
            <TimerSettings
              onSetTime={handleSetTime}
              currentTime={timeRemaining}
              isActive={isActive}
              onBackgroundChange={handleBackgroundChange}
              currentBackground={backgroundImage}
            />

            <div className="flex flex-col items-center w-full p-16 mt-40 max-w-7xl">
              <div className="w-full max-w-6xl scale-125">
                <Timer timeRemaining={timeRemaining} />
                <div
                  className={`transition-opacity duration-300 ${
                    showControls ? "opacity-100" : "opacity-0"
                  }`}
                >
                  <TimerControls
                    isActive={isActive}
                    isPaused={isPaused}
                    onStart={handleStart}
                    onPause={handlePause}
                    onResume={handleResume}
                    onRestart={handleRestart}
                  />
                </div>
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
